<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCANA - Iniciar sesión</title>
  <link rel="icon" type="image/png" href="imagenes/logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">

  <main class="login-card">
    <div class="login-header">
      <a href="index.html" aria-label="Volver al inicio">
        <img src="imagenes/logo.png" alt="Logo ARCANA" style="height: 100px; width: auto;">
      </a>
      <h1>ARCANA</h1>
      <p>AGENCIA MULTIMEDIA</p>
    </div>

    <form id="loginForm" novalidate>
      <p style="font-size: 0.8rem; color: var(--accent-gold); margin-bottom: 1rem;">
        <strong>Credenciales de acceso:</strong><br>
        Correo: <code>hola@arcanaagency.com</code><br>
        PIN: <code>1234</code>
      </p>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" class="form-control" placeholder="hola@arcanaagency.com" required>
        <span class="form-error" id="emailError" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="pin">PIN de Seguridad (4 dígitos)</label>
        <input type="password" id="pin" class="form-control pin-input" inputmode="numeric" maxlength="4" placeholder="••••" required>
        <span class="form-error" id="pinError" role="alert"></span>
      </div>

      <div class="login-actions">
        <button type="submit" class="btn btn-primary">INGRESAR</button>
        <a href="index.html" class="btn btn-secondary">REGRESAR</a>
      </div>
    </form>

      <a href="contacto.html" class="forgot-link">OLVIDÉ MI CONTRASEÑA</a>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
